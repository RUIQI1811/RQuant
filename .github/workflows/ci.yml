name: RQuant quality gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install core dependencies and project
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Verify public CLI import and help
        run: python -m rquant --help
      - name: Compile Python modules
        run: python -m compileall -q agent backtest dashboard domain factors labels market models reports rquant scripts signals strategies training
      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
