# gemini_review.yaml
# Gemini 图表复评配置（相对路径基于项目根目录）

# 候选列表 JSON
candidates: data/candidates/candidates_latest.json

# 候选图表目录（其下按 pick_date 分目录）
kline_dir: data/kline

# 评分结果输出目录
output_dir: data/review

# 提示词文件
prompt_path: agent/prompt.md

# Gemini 模型名称
model: gemini-2.5-flash-lite

# 主模型繁忙或临时不可用时，依次尝试这些备用模型
retry_models:
  - gemini-2.5-flash
  - gemini-2.5-flash-lite

# 单个模型每只股票最多重试次数
max_retries: 3

# 重试等待基准秒数，实际等待为 base、2*base、4*base...
retry_base_delay: 10

# 相邻 API 调用间隔（秒）
request_delay: 5

# true: 跳过已存在单股 JSON（断点续跑）
skip_existing: true

# 研究候选展示的最小分数门槛
suggest_min_score: 4.0
