# GTJA191 economic-interpretability lifecycle.
#
# `watch` means the formula expresses a direct, testable A-share hypothesis;
# it is not a production recommendation. `disabled` (the default) preserves
# the formula for reproduction only and excludes it from normal batch/ML
# selection. No factor is `active` solely because of a historical backtest.
#
# Complex composites with arbitrary fitted weights, raw-price thresholds or
# powers, opaque nested ranks, and external-data expressions without a clear
# stock-selection mechanism remain disabled until they have both a documented
# economic hypothesis and an out-of-sample long-only validation.
default_status: disabled
factors:
  # Price location, trend/reversal and volatility hypotheses.
  gtja_012: watch
  gtja_015: watch
  gtja_034: watch
  gtja_038: watch
  gtja_046: watch
  gtja_065: watch

  # Price-volume, liquidity and intraday-demand hypotheses.
  gtja_005: watch
  gtja_007: watch
  gtja_016: watch
  gtja_032: watch
  gtja_042: watch
  gtja_048: watch
  gtja_062: watch
  gtja_083: watch
  gtja_090: watch
  gtja_099: watch
  gtja_105: watch
  gtja_136: watch
  gtja_139: watch
  gtja_144: watch
  gtja_168: watch
  gtja_184: watch
