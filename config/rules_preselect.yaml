# rules_preselect.yaml
# 量化初选规则配置文件
# pipeline/select_stock.py 读取本文件中的参数

# ── 全局设置 ─────────────────────────────────────────────────────────
global:
  data_dir: "./data/raw"          # A股日线CSV目录
  output_dir: "./data/candidates" # 候选结果输出目录
  top_m: 5000                     # 流动性池：取成交额最高的 top_m 只
  n_turnover_days: 43             # 滚动成交额窗口（日）
  min_bars_buffer: 10             # 额外的最小 bar 缓冲

# ── 回测股票池过滤 ─────────────────────────────────────────────────
stock_pool:
  top_m: 5000                     # 每日按成交额保留前 N 只
  min_price: 1.0                  # 排除低价异常标的
  min_turnover: 0.0               # 最低滚动成交额门槛，0 表示不启用
  exclude_boards: []              # 可选 gem/star/bj；原始抓取层默认已排除这些板块
  require_tradeable: true         # 排除停牌或不可交易日

# ── B1 策略参数（KDJ + 知行均线多头排列） ────────────────────────────
b1:
  enabled: false
  zx_m1: 14
  zx_m2: 28
  zx_m3: 57
  zx_m4: 114
  j_threshold: 15.0
  j_q_threshold: 0.10

# ── 砖型图（BrickChart）策略参数 ──────────────────────────────────────
brick:
  enabled: false

  # 砖型图计算参数
  n: 8
  m1: 3
  m2: 12
  m3: 12
  t: 8
  shift1: 92
  shift2: 114
  sma_w1: 1
  sma_w2: 1
  sma_w3: 1

  # 选股过滤阈值
  daily_return_threshold: 0.2    # 今日涨幅上限
  brick_growth_ratio: 0.5         # 今日红柱 >= N × 昨日绿柱绝对值
  min_prior_green_bars: 1         # 红柱前至少有几根连续绿柱

  # 知行线参数
  zxdq_ratio: 1.47                 # 收盘价 < zxdq × ratio；null = 不启用
  zxdq_span: 10
  require_zxdq_gt_zxdkx: true
  zxdkx_m1: 14
  zxdkx_m2: 28
  zxdkx_m3: 57
  zxdkx_m4: 114

  # 周线均线多头排列
  require_weekly_ma_bull: true
  wma_short: 5
  wma_mid: 10
  wma_long: 20

# ── mBDSR 风格趋势回踩策略 ──────────────────────────────────────
mbdsr:
  enabled: false
  # false: 信号当日买入；true: 次日收盘突破信号日最高价才确认
  use_next_confirm: false
  extra_bars_buffer: 10

# ── BDSR 金叉 + MACD 水上金叉 + OBV 上升共振策略 ───────────────
bdsr_macd_obv:
  enabled: true
  # BDSR 明确定义为快慢 RCI：RCI9 当日上穿 RCI26
  bdsr_fast_window: 9
  bdsr_slow_window: 26
  # MACD 水上金叉：DIF 上穿 DEA，且两者都大于 0
  macd_fast_period: 12
  macd_slow_period: 26
  macd_signal_period: 9
  # OBV 位于均线上方，且 OBV 均线较 N 日前上升
  obv_ma_window: 20
  obv_trend_lookback: 3
  extra_bars_buffer: 10
