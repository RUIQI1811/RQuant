[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rquant-local"
version = "0.1.0"
description = "Local A-share quantitative research and decision-support workflows"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
rquant = "rquant.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["."]
include = [
  "agent*",
  "backtest*",
  "dashboard*",
  "domain*",
  "factors*",
  "labels*",
  "market*",
  "models*",
  "reports*",
  "rquant*",
  "scripts*",
  "signals*",
  "strategies*",
  "training*",
]
exclude = ["tests*"]
